<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warp</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --panel: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #d9d9d6;
      --accent: #ec3750;
      --cage: #338eda;
      --check: #e9e9e6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17171a;
        --panel: #222226;
        --ink: #f2f2f2;
        --muted: #9a9aa0;
        --line: #36363c;
        --check: #1f1f23;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 15px; margin: 0 8px 0 0; }
    .group { display: flex; align-items: center; gap: 8px; }
    button, label.btn {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
    }
    button:hover, label.btn:hover { border-color: var(--muted); }
    select {
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .muted { color: var(--muted); }
    #status { margin-left: auto; font-variant-numeric: tabular-nums; }
    .workspace { display: grid; grid-template-columns: 1fr auto; min-height: 0; }
    .workspace.no-points aside { display: none; }
    aside {
      width: 340px;
      overflow-y: auto;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 4px 16px 16px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    aside h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font: 600 12px/1 system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    aside p { font-family: system-ui, sans-serif; margin: 0 0 8px; }
    aside table { width: 100%; border-collapse: collapse; }
    aside th { text-align: left; font-weight: 500; color: var(--muted); padding: 2px 4px; }
    aside td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; }
    aside td.err { color: var(--accent); }
    #cage-rows td.muted { white-space: nowrap; }
    aside input[type="number"] {
      width: 72px;
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 4px;
    }
    button.small { padding: 1px 8px; font-size: 12px; }
    @media (max-width: 720px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; }
      aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    }
    aside .err { color: var(--accent); }
    button.small.on { border-color: var(--accent); color: var(--accent); }
    #dial-play { min-width: 64px; }
    #dial { opacity: 0; transition: opacity 0.25s; }
    #dial.shown, #dial.active { opacity: 1; }
    #dial-play.on { border-color: var(--accent); color: var(--accent); }
    main {
      position: relative;
      overflow: hidden;
      background-color: var(--bg);
      background-image:
        linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%),
        linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    main.dragover { outline: 3px dashed var(--accent); outline-offset: -12px; }
    #stage { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    #stage.panning { cursor: grabbing; }
    #raster { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #stage { position: relative; }
    .seg { gap: 0; }
    .seg button { border-radius: 0; margin-left: -1px; }
    .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .seg button:last-child { border-radius: 0 6px 6px 0; }
    .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .seg button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); position: relative; }
    .zoom { gap: 0; }
    .zoom button { border-radius: 0; margin-left: -1px; min-width: 32px; font-variant-numeric: tabular-nums; }
    .zoom button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .zoom button:last-child { border-radius: 0 6px 6px 0; }
    #zoom-fit { min-width: 60px; }
    #ghost { opacity: 0.18; pointer-events: none; }
    .cage-edge { fill: none; stroke: var(--cage); vector-effect: non-scaling-stroke; stroke-width: 1.5; pointer-events: none; }
    .cage-morph { fill: none; stroke: var(--accent); vector-effect: non-scaling-stroke; stroke-width: 1.5; opacity: 0.8; pointer-events: none; }
    #morph-play { min-width: 80px; }
    #morph-play.on { border-color: var(--accent); color: var(--accent); }
    #morph-val { min-width: 3.5ch; }
    .cage-rest { fill: none; stroke: var(--muted); vector-effect: non-scaling-stroke; stroke-width: 1; stroke-dasharray: 4 4; pointer-events: none; }
    .ctrl-arm { stroke: var(--cage); vector-effect: non-scaling-stroke; stroke-width: 1; opacity: 0.6; pointer-events: none; }
    .ctrl-handle { fill: var(--panel); stroke: var(--cage); vector-effect: non-scaling-stroke; stroke-width: 1.5; cursor: move; }
    .ctrl-handle:hover { fill: var(--cage); }
    .dial-ring { fill: none; stroke: var(--cage); vector-effect: non-scaling-stroke; stroke-width: 1.5; stroke-dasharray: 2 5; opacity: 0.8; }
    .dial-hit { fill: none; stroke: transparent; pointer-events: stroke; cursor: grab; }
    .dial-knob { fill: var(--cage); stroke: var(--panel); vector-effect: non-scaling-stroke; stroke-width: 2; cursor: grab; }
    .dial-label { fill: var(--ink); stroke: var(--bg); stroke-width: 3; paint-order: stroke; vector-effect: non-scaling-stroke; font-family: system-ui, sans-serif; font-weight: 600; pointer-events: none; }
    .dial-spread { fill: none; stroke: var(--cage); stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: 0.35; pointer-events: none; }
    .dial-tick { stroke: var(--cage); vector-effect: non-scaling-stroke; stroke-width: 1.5; opacity: 0.8; pointer-events: none; }
    #dial.active .dial-hit, #dial.active .dial-knob { cursor: grabbing; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 12; vector-effect: non-scaling-stroke; cursor: copy; }
    .edge-hit:hover { stroke: color-mix(in srgb, var(--cage) 25%, transparent); }
    .handle { fill: var(--panel); stroke: var(--cage); vector-effect: non-scaling-stroke; stroke-width: 2; cursor: grab; }
    .handle:hover, .handle.active { fill: var(--cage); }
    .handle.active { cursor: grabbing; }
    .handle.selected { fill: var(--accent); stroke: var(--accent); }
    .lasso { fill: var(--cage); fill-opacity: 0.08; stroke: var(--cage); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
    #stage.lasso-tool { cursor: crosshair; }
    #lasso-tool.on { border-color: var(--accent); color: var(--accent); }
    #cage-rows tr.selected td:first-child { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Warp</h1>
    <div class="group">
      <select id="sample" title="Built-in sample"></select>
      <label class="btn">Import<input id="file" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp,image/gif" hidden /></label>
      <div class="seg" id="cage-mode" title="Deform: drag to warp · Edit: reshape the rest cage. Double-click an edge to add a point; alt-click or right-click a point to remove it.">
        <button data-cage-mode="deform" class="on">Deform</button>
        <button data-cage-mode="edit">Edit</button>
      </div>
      <span class="muted" title="Warp passes: each pass warps the previous pass's result with its own cage. Click a number to edit that pass.">Pass</span>
      <div class="seg" id="passes"></div>
      <button id="pass-add" title="Add a warp pass with a plain cage around the current result">+ Pass</button>
      <button id="pass-remove" title="Remove the pass being edited">− Pass</button>
      <button id="lasso-tool" title="Lasso (L): drag to select points. Shift adds, alt subtracts. Shift-drag lassos without the tool. Click a point to select it, shift-click to toggle, drag to move the selection; arrows nudge, Delete removes, Esc clears, Cmd/Ctrl+A selects all.">Lasso</button>
      <button id="reset" title="Undo the deformation">Reset cage</button>
      <label class="btn" title="Load a cage from an SVG (id=&quot;cage&quot; or its first shape; id=&quot;cage-deformed&quot; too, if present) or a JSON file">Import cage<input id="cage-file" type="file" accept=".svg,.json,image/svg+xml,application/json" hidden /></label>
      <button id="export-cage" title="Save both cages as red SVG paths (id=&quot;cage&quot; and id=&quot;cage-deformed&quot;)">Export cage</button>
      <button id="copy-cage" title="Copy the rest cage as a red SVG path (id=&quot;cage&quot;)">Copy icage</button>
      <button id="export" class="primary">Export SVG</button>
    </div>
    <div class="group">
      <label for="method" class="muted">Method</label>
      <select id="method"></select>
    </div>
    <div class="group seg" id="mode">
      <button data-mode="svg" class="on">SVG</button>
      <button data-mode="raster">Raster</button>
    </div>
    <div class="group zoom">
      <button id="zoom-out" title="Zoom out (-)">−</button>
      <button id="zoom-fit" title="Fit (0)">100%</button>
      <button id="zoom-in" title="Zoom in (+)">+</button>
    </div>
    <div class="group">
      <label for="subdiv" id="subdiv-label" class="muted">Subdivisions</label>
      <input id="subdiv" type="range" min="1" max="16" value="4" />
      <span id="subdiv-val">4</span>
    </div>
    <label class="group" title="Bezier cage edges. Off: every edge is straight (curves are kept for later)."><input id="curves" type="checkbox" checked /> Curves</label>
    <label class="group" title="Ring at the cage center: turn it to carry the deformation around the cage from point to point (a full turn comes back). Shift snaps point-onto-point, double-click returns to the start."><input id="dial-on" type="checkbox" /> Dial</label>
    <label class="group" title="How far each pull is shared with neighbouring points as the dial turns (0° = point to point)."><span class="muted">Spread</span><input id="dial-spread" type="range" min="0" max="90" value="30" /><span id="dial-spread-val"></span></label>
    <button id="dial-play" title="Keep the dial turning (P)">Play</button>
    <label class="group" title="Tween the warp from the original (0%) to the deformation (100%). Double-click to reset to 100%."><span class="muted">Morph</span><input id="morph" type="range" min="0" max="100" value="100" /><span id="morph-val"></span></label>
    <button id="morph-play" title="Loop the morph between original and deformed (M)">Animate</button>
    <label class="group"><input id="show-ghost" type="checkbox" checked /> Show original</label>
    <label class="group"><input id="show-points" type="checkbox" checked /> Points console</label>
    <span id="status" class="muted"></span>
  </header>
  <div class="workspace">
  <main id="drop">
    <canvas id="raster"></canvas>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg">
      <g id="ghost"></g>
      <g id="content"></g>
      <g id="overlay">
        <path id="cage-rest" class="cage-rest" />
        <path id="cage" class="cage-edge" />
        <path id="cage-morph" class="cage-morph" />
        <g id="edge-hits"></g>
        <g id="dial"></g>
        <g id="ctrls"></g>
        <g id="handles"></g>
        <path id="lasso" class="lasso" />
      </g>
    </svg>
  </main>
  <aside id="points">
    <section>
      <h2>Cage</h2>
      <p class="muted">Double-click an edge to add a point. Alt-click or right-click a point to remove it. With Curves on, drag a square to curve an edge; double-click it to straighten.</p>
      <table>
        <thead><tr><th>#</th><th id="cage-other">rest</th><th>x</th><th>y</th><th></th></tr></thead>
        <tbody id="cage-rows"></tbody>
      </table>
    </section>
  </aside>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
